<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moji bodovi — LAX Studio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/book.js" defer></script>
<style>
:root{--bg:#f7f1ea;--card:#fbf7f2;--line:#e4d6c5;--ink:#2b2420;--muted:#7a6c60;--gold:#a8803f;--gold2:#c9a467;--rose:#b4506b;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px}
a{color:inherit}
.top{display:flex;align-items:center;gap:12px;text-decoration:none;margin-bottom:26px}.top img{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--gold2)}
.top b{font-family:var(--serif);font-weight:500;font-size:26px;display:block;line-height:1}.top small{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.card{width:100%;max-width:440px;background:#2b2420;color:#f7f1ea;border-radius:26px;padding:28px 26px;box-shadow:0 24px 60px rgba(43,36,32,.25);position:relative;overflow:hidden}
.card:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:1px solid rgba(201,164,103,.35)}
.hi{font-family:var(--serif);font-size:30px;font-weight:400;margin:0 0 4px}.sub{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold2)}
.pts{font-family:var(--serif);font-size:76px;line-height:1;margin:22px 0 2px;color:#fff}.pts small{font-size:22px;color:var(--gold2);margin-left:8px}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:10px;margin:18px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e8cf9a);border-radius:10px}
.next{font-size:14px;color:#e6dccf}.next b{color:#fff;font-weight:500}
.valid{font-size:12px;color:#b9ab9b;margin-top:16px}
.rw{width:100%;max-width:440px;margin-top:22px}.rw h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 10px}
.r{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:8px;font-size:15px}
.r span{color:var(--muted);font-size:13px;white-space:nowrap;margin-left:10px}
.r.ok{border-color:var(--gold2);background:#fff}.r.ok span{color:var(--rose);font-weight:500}.r.ok:before{content:"✓";color:var(--rose);margin-right:10px;font-weight:600}
.r .n{flex:1}
.how{width:100%;max-width:440px;font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:22px;padding:15px 30px;border-radius:40px;background:var(--gold);color:#fff;text-decoration:none;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;border:0;cursor:pointer;font-family:var(--sans)}
.msg{max-width:440px;text-align:center;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<a class="top" href="/"><img src="/logo.png" alt=""><span><b>LAX Studio</b><small>Program vjernosti</small></span></a>
<div id="app" class="msg">Učitavanje…</div>
<script>
(async function () {
  const C = window.LAX_CONFIG || {}, el = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const tok = (new URLSearchParams(location.search).get('k') || (location.hash || '').replace('#', '')).trim();
  const bad = () => el.innerHTML = 'Ovaj link nije ispravan ili je zamijenjen novim.<br>Javi nam se na Viber i poslaćemo ti tvoj link.<br><a class="btn" href="#" data-book>Kontaktirajte nas</a>';
  if (tok.length < 10) return bad();
  const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
  const {data, error} = await sb.rpc('lax_card', {p_token: tok});
  if (error || !data) return bad();
  const p = Math.max(0, data.points), R = data.rewards || [];
  const nx = R.find(r => r.points > p), prev = [...R].reverse().find(r => r.points <= p);
  const pct = nx ? Math.round(p / nx.points * 100) : 100;
  const vd = data.valid_until ? new Date(data.valid_until) : null, vu = vd ? vd.getDate() + '.' + (vd.getMonth() + 1) + '.' + vd.getFullYear() : '';
  el.className = ''; el.style.width = '100%'; el.style.display = 'flex'; el.style.flexDirection = 'column'; el.style.alignItems = 'center';
  el.innerHTML = `<div class="card">
      <p class="hi">Ćao, ${esc(data.name)}</p><div class="sub">Tvoji bodovi</div>
      <div class="pts">${p}<small>bodova</small></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="next">${nx ? `Do nagrade <b>${esc(nx.name)}</b> fali ti još <b>${nx.points - p}</b> bodova.` : 'Možeš iskoristiti bilo koju nagradu!'}${prev && nx ? `<br>Već možeš uzeti: <b>${esc(prev.name)}</b>` : ''}</div>
      ${vu ? `<div class="valid">Bodovi važe do ${vu}. Svaka posjeta produžava rok.</div>` : ''}
    </div>
    <div class="rw"><h2>Nagrade</h2>${R.map(r => `<div class="r ${r.points <= p ? 'ok' : ''}"><span class="n" style="color:inherit;font-size:15px;margin:0">${esc(r.name)}</span><span>${r.points} bodova</span></div>`).join('')}</div>
    <p class="how">Za svaku potrošenu 1 KM dobijaš 1 bod. Dopuna na vrijeme donosi duplo bodova. Nagradu iskoristiš u salonu, samo nam reci prije tretmana.</p>
    <a class="btn" href="#" data-book>Zakažite termin</a>`;
})();
</script>
</body>
</html>
